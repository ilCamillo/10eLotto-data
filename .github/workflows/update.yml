name: Update Data
on:
  schedule:
    - cron: '30 19,20 * * 2,4,5,6' # Esegue alle 20:30 e 21:30 italiane (Mar, Gio, Ven, Sab)
  workflow_dispatch: # Permette di avviarlo a mano per testare
jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run script
        env:
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
        run: python scrape_lotto.py
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add storico_10elotto.csv
          git commit -m "Auto-update" || exit 0
          git push
